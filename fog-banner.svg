<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="fog: a webcam mirror that fogs up when you breathe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26313a"/>
      <stop offset="1" stop-color="#0d1114"/>
    </linearGradient>
    <filter id="cloud" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="haze" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <mask id="wipe" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="300">
      <rect width="900" height="300" fill="#000"/>
      <path d="M170 190 C 300 110, 470 250, 740 140" fill="none" stroke="#fff" stroke-width="120" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0;0;1;1" keyTimes="0;0.3;0.62;0.9;1" dur="10s" repeatCount="indefinite"/>
      </path>
    </mask>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- fogged text, seen through the haze -->
  <text x="450" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="180" fill="#e9eeef" opacity="0.4" filter="url(#haze)">fog</text>

  <!-- drifting fog banks -->
  <g fill="#f2eee7" filter="url(#cloud)">
    <ellipse cx="200" cy="120" rx="230" ry="70" opacity="0.38">
      <animateTransform attributeName="transform" type="translate" values="-60 0;90 14;-60 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="190" rx="260" ry="80" opacity="0.34">
      <animateTransform attributeName="transform" type="translate" values="70 0;-90 -12;70 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="430" cy="250" rx="300" ry="60" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="-40 0;60 -10;-40 0" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="780" cy="70" rx="180" ry="55" opacity="0.28">
      <animateTransform attributeName="transform" type="translate" values="30 0;-70 10;30 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- the same word, crisp, revealed by a finger wipe -->
  <text x="450" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="180" fill="#ffffff" mask="url(#wipe)">fog</text>

  <!-- a drip running down the glass -->
  <line x1="742" y1="215" x2="742" y2="215" stroke="#0d1114" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <animate attributeName="y2" values="215;215;292;292" keyTimes="0;0.25;0.85;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="2s" repeatCount="indefinite"/>
  </line>
  <circle cx="742" cy="215" r="4.5" fill="#fff" opacity="0.7">
    <animate attributeName="cy" values="215;215;292;292" keyTimes="0;0.25;0.85;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="282" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" fill="#c9d3d6" letter-spacing="2">
    breathe · pinch · wipe
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
